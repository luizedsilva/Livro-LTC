<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador Enigma</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script></head><body><main><h1>Simulador da Máquina Enigma</h1><p>Modelo didático baseado no programa C fornecido.</p><section class="card"><h2>Configuração</h2><div class="grid"><label>Rotor 1<select id="r1"></select></label><label>Rotor 2<select id="r2"></select></label><label>Rotor 3<select id="r3"></select></label><label>Refletor<select id="ref"></select></label><label>Posição inicial<input id="pos" value="AAA" maxlength="3"></label><label>Plugboard<input id="plug" value="" maxlength="8" placeholder="CDQT"></label></div><button id="apply">Aplicar</button><button id="default">Padrão</button><span id="msg"></span></section><section class="card"><div id="canvas"></div></section><section class="card"><h2>Mensagem</h2><textarea id="text" maxlength="80" rows="3" placeholder="Digite o texto..."></textarea><br><button id="encode">Cifrar</button><button id="start">Iniciar passo a passo</button><button id="next">Próximo caractere</button><button id="finish">Executar restante</button><button id="clear">Limpar</button><div class="result">Entrada: <b id="in">—</b><br>Saída: <b id="out">—</b></div></section><section class="card"><h2>Percurso da letra</h2><div id="path" class="path">Processe uma letra para visualizar o percurso.</div></section><section class="card"><h2>Histórico</h2><div class="scroll"><table><thead><tr><th>#</th><th>Entrada</th><th>Antes</th><th>Depois</th><th>Plug</th><th>R3→R2→R1</th><th>Ref.</th><th>R1→R2→R3</th><th>Saída</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script src="sketch.js"></script></body></html>
